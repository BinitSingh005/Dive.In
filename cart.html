</head>
<body>

  <div class="cart-container">
    <h2>Your Cart</h2>

  </div>

      },
      {

      }
      ,
      {

      },
      {

      {

      {

      {

      },
      {

      {
        id: 19,

        image: "images/game19.jpg"
      },
      {
        id: 20,
        name: "Marvel Rivals",
        price: 499,
        image: "images/game20.jpg"
      }
      
    ];

    function removeItem(gameId){
      let cart = JSON.parse(sessionStorage.getItem('cart')) || [];
      cart = cart.filter(id => id !== gameId);
      sessionStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function renderCart() {
      let cart = JSON.parse(sessionStorage.getItem('cart')) || [];
      let container = document.getElementById('cart-items');
      container.innerHTML = "";
      if(cart.length === 0){
        container.innerHTML = "<p>Your cart is empty.</p>";
        return;
      }
      let total = 0;
      cart.forEach(gameId => {
        const game = games.find(g => g.id === gameId);
        if(game){
          total += game.price;
          container.innerHTML += `
            <div class="cart-item">
              <img src="${game.image}" alt="${game.name}">
              <strong>${game.name}</strong>
              <span style="margin-left:18px;">₹${game.price}</span>
              <button class="remove-btn details-btn" onclick="removeItem(${game.id})">Remove</button>
            </div>
          `;
        }
      });
      container.innerHTML += `<hr><h3>Total: ₹${total}</h3>`;
    }

    function checkout(){
      sessionStorage.removeItem('cart');
      alert("Thanks for purchasing! Your cart has been cleared.");
      renderCart();
    }

    window.onload = renderCart;
  </script>
</body>
</html>
